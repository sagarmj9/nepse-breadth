name: Daily NEPSE breadth update

on:
  schedule:
    # 15:45 and 17:45 Nepal time (NEPSE closes at 15:00). The second run is a backup.
    - cron: '0 10 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:   # "Run workflow" button for a manual update

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install NEPSE library
        run: pip install git+https://github.com/basic-bgnr/NepseUnofficialApi

      - name: Fetch prices and calculate breadth
        run: python scripts/update.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "Breadth update $(date -u +%F)"
            git push
          fi
