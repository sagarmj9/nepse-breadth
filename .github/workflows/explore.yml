name: Explore (one-off)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install git+https://github.com/basic-bgnr/NepseUnofficialApi
      - run: python scripts/explore.py
      - name: Save results to the explore-data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan explore-data
          git rm -rq --cached .
          git add -f explore_out
          git commit -qm "exploration output"
          git push -f origin explore-data
