name: Inspect sheet formatting (one-off)
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl
      - name: Read formatting of Sheet1
        run: |
          curl -sSL -o s.xlsx "https://docs.google.com/spreadsheets/d/1Ois186HztaKjZMJoW7RXpOIjYmgB4PBWoP4ghWNdKiI/export?format=xlsx"
          python - <<'PY'
          import openpyxl
          from openpyxl.utils import get_column_letter as L
          wb = openpyxl.load_workbook("s.xlsx")
          print("SHEETS:", wb.sheetnames)
          ws = wb["Sheet1"] if "Sheet1" in wb.sheetnames else wb.worksheets[-1]
          print("DIM", ws.dimensions, "freeze", ws.freeze_panes, "merged", list(ws.merged_cells.ranges)[:20])
          for c in range(1, ws.max_column + 1):
              print("COLWIDTH", L(c), ws.column_dimensions[L(c)].width)
          def desc(cell):
              f = cell.fill.fgColor.rgb if cell.fill and cell.fill.fill_type else None
              fc = getattr(getattr(cell.font, "color", None), "rgb", None)
              return f"{cell.coordinate}={str(cell.value)[:40]!r} fill={f} font={fc} b={cell.font.b} sz={cell.font.sz} fmt={cell.number_format} al={cell.alignment.horizontal} wrap={cell.alignment.wrap_text} "
          for r in list(range(1, 9)) + [20, 40]:
              for c in range(1, ws.max_column + 1):
                  cell = ws.cell(r, c)
                  if cell.value is not None or (cell.fill and cell.fill.fill_type):
                      print("CELL", desc(cell))
          print("ROWHEIGHTS", {r: ws.row_dimensions[r].height for r in range(1, 8)})
          for rng, rules in ws.conditional_formatting._cf_rules.items():
              for rule in rules:
                  cs = rule.colorScale
                  info = ""
                  if cs:
                      info = " | ".join(f"{v.type}:{v.val}->{c.rgb}" for v, c in zip(cs.cfvo, cs.color))
                  dx = None
                  if rule.dxf:
                      dx = (rule.dxf.fill.fgColor.rgb if rule.dxf.fill else None, rule.dxf.fill.bgColor.rgb if rule.dxf.fill else None, rule.dxf.font.color.rgb if rule.dxf.font and rule.dxf.font.color else None)
                  print("CF", rng.sqref, rule.type, rule.operator, rule.formula, info, "dxf", dx)
          PY
