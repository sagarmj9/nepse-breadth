name: NEPSE data test

on:
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install NEPSE library
        run: pip install git+https://github.com/basic-bgnr/NepseUnofficialApi

      - name: Test NEPSE data
        run: |
          python - <<'EOF'
          import os, json, traceback
          from nepse import Nepse

          out = []
          def log(line=""):
              print(line)
              out.append(line)

          def check(name, fn):
              try:
                  data = fn()
                  if isinstance(data, dict) and isinstance(data.get("content"), list):
                      items = data["content"]
                  elif isinstance(data, list):
                      items = data
                  else:
                      items = None
                  if items is not None:
                      log(f"### ✅ {name}: {len(items)} items")
                      if items:
                          log("Fields: " + ", ".join(map(str, items[0].keys())) if isinstance(items[0], dict) else "")
                          log("Sample: `" + json.dumps(items[0], ensure_ascii=False)[:400] + "`")
                  else:
                      log(f"### ✅ {name}")
                      log("Sample: `" + json.dumps(data, ensure_ascii=False)[:400] + "`")
              except Exception as e:
                  log(f"### ❌ {name}: {type(e).__name__}: {e}")
              log()

          nepse = Nepse()
          nepse.setTLSVerification(False)  # NEPSE's SSL certificate problem (as the library recommends)

          check("Market status", nepse.getMarketStatus)
          check("Today's prices, all stocks", nepse.getPriceVolume)
          check("All-stock prices for a past day (2026-11-19)", lambda: nepse.getPriceVolumeHistory("2026-11-19"))
          check("One stock's price history (NABIL)", lambda: nepse.getCompanyPriceVolumeHistory("NABIL"))
          check("NEPSE index", nepse.getNepseIndex)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "w") as f:
              f.write("\n\n".join(out))
          EOF
