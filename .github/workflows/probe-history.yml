name: Probe old history (one-off)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install git+https://github.com/basic-bgnr/NepseUnofficialApi
      - run: |
          python - <<'PY'
          import time, json
          from nepse import Nepse
          n = Nepse(); n.setTLSVerification(False)
          for a,b in [("2020-01-01","2020-12-31"),("2022-01-01","2022-12-31"),("2024-01-01","2024-12-31"),("2025-01-01","2025-11-30")]:
              try:
                  r = n.getCompanyPriceVolumeHistory("NABIL", a, b)
                  c = r.get("content", []) if isinstance(r, dict) else r
                  print("COMPANY NABIL", a, b, len(c), c[0] if c else "")
              except Exception as e:
                  print("COMPANY NABIL", a, b, "ERROR", type(e).__name__, str(e)[:120])
          for a,b in [("2020-01-01","2020-12-31"),("2024-01-01","2024-12-31")]:
              try:
                  r = n.requestGETAPI(url=f"/api/nots/index/history/58?size=500&startDate={a}&endDate={b}")
                  c = r.get("content", [])
                  print("INDEXRANGE", a, b, len(c), c[0]["businessDate"] if c else "", c[-1]["businessDate"] if c else "")
              except Exception as e:
                  print("INDEXRANGE", a, b, "ERROR", type(e).__name__, str(e)[:120])
          PY
